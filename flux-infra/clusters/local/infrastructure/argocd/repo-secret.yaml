apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-repo
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: my-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        url: "https://github.com/mwalilisteve/agribora-technical-assesment/"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/argocd/my-repo
        property: username
    - secretKey: password
      remoteRef:
        key: secret/argocd/my-repo
        property: password