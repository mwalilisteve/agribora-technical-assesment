apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 5m
  timeout: 15m

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: argo-cd
      version: ">=5.0.0"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system

  values:
    dex:
      enabled: false

    server:
      service:
        type: ClusterIP

    applicationSet:
      enabled: false

    configs:
      params:
        server.insecure: true