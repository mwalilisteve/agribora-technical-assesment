apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m

  install:
    createNamespace: true

  chart:
    spec:
      chart: traefik
      version: ">=24.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system

  values:
    deployment:
      replicas: 2

    service:
      type: LoadBalancer

    providers:
      kubernetesCRD:
        enabled: true

    metrics:
      prometheus:
        enabled: true
