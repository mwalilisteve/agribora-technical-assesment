apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: gitea-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-secret      
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: secret/gitea
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/gitea
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/gitea
        property: POSTGRES_PASSWORD
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/gitea
        property: SECRET_KEY
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: secret/gitea
        property: INTERNAL_TOKEN
